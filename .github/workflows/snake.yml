name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: somali0128
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=58a6ff&color_dots=#0d1117,#1f3a5f,#2563eb,#3b82f6,#60a5fa

      - name: Download static GitHub summary cards
        run: |
          mkdir -p dist/profile-summary-cards
          curl --fail-with-body --location --retry 3 \
            "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true" \
            --output dist/profile-summary-cards/github-stats.svg
          curl --fail-with-body --location --retry 3 \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true" \
            --output dist/profile-summary-cards/top-languages.svg
          test -s dist/profile-summary-cards/github-stats.svg
          test -s dist/profile-summary-cards/top-languages.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
