name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/generate_streak.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: "-3"
          AUTO_PUSH: false
          THEME: tokyonight

      - uses: Platane/snk@v3
        with:
          github_user_name: somali0128
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=58a6ff&color_dots=#0d1117,#1f3a5f,#2563eb,#3b82f6,#60a5fa

      - name: Add static summary cards to published assets
        run: |
          git fetch origin output --depth=1
          if [ -s profile-summary-card-output/tokyonight/3-stats.svg ]; then
            stats_card=profile-summary-card-output/tokyonight/3-stats.svg
          else
            stats_card="$RUNNER_TEMP/github-stats.svg"
            git show origin/output:profile-summary-cards/github-stats.svg > "$stats_card"
          fi
          if [ -s profile-summary-card-output/tokyonight/1-repos-per-language.svg ]; then
            languages_card=profile-summary-card-output/tokyonight/1-repos-per-language.svg
          else
            languages_card="$RUNNER_TEMP/top-languages.svg"
            git show origin/output:profile-summary-cards/top-languages.svg > "$languages_card"
          fi
          sudo install -D "$stats_card" dist/profile-summary-cards/github-stats.svg
          sudo install -D "$languages_card" dist/profile-summary-cards/top-languages.svg
          test -s dist/profile-summary-cards/github-stats.svg
          test -s dist/profile-summary-cards/top-languages.svg

      - name: Generate GitHub streak card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python .github/scripts/generate_streak.py "$RUNNER_TEMP/github-streak.svg"
          sudo install -D "$RUNNER_TEMP/github-streak.svg" dist/github-streak.svg
          test -s dist/github-streak.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
