name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - ".github/scripts/generate_streak.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: somali0128
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=58a6ff&color_dots=#0d1117,#1f3a5f,#2563eb,#3b82f6,#60a5fa

      - name: Generate static GitHub summary cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          python scripts/generate_profile_cards.py \
            --username "${{ github.repository_owner }}" \
            --output-dir dist/profile-summary-cards
          test -s dist/profile-summary-cards/github-stats.svg
          test -s dist/profile-summary-cards/top-languages.svg

      - name: Generate GitHub streak card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          python .github/scripts/generate_streak.py "$RUNNER_TEMP/github-streak.svg"
          sudo install -D "$RUNNER_TEMP/github-streak.svg" dist/github-streak.svg
          test -s dist/github-streak.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
